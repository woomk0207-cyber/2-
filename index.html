<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2인 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>2인 게임</h1>
  <div id="scoreboard">
    <span class="p1">P1: <b id="score1">0</b></span>
    <span class="p2">P2: <b id="score2">0</b></span>
  </div>
  <canvas id="game" width="800" height="500"></canvas>
  <p class="help">P1: WASD 이동 · F 발사 &nbsp;|&nbsp; P2: 방향키 이동 · L 발사 &nbsp;|&nbsp; R: 새 경기 (3선승)</p>
  <script src="game.js"></script>
</body>
</html>
